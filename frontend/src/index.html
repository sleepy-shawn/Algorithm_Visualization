<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>算法与复杂度可视化学习平台</title>
  <base href="/">
  <script>
    try {
      var savedTheme = localStorage.getItem('algorithm-viz-theme');
      document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.lang = localStorage.getItem('algorithm-viz-language') === 'en' ? 'en' : 'zh-CN';
    } catch (_) {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
