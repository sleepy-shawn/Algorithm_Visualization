<main class="auth-layout">
  <section>
    <div class="mb-8 flex items-center gap-3"><span class="flex h-10 w-10 items-center justify-center rounded-lg border border-accent/30 font-mono text-xl text-accent" aria-hidden="true"><app-ui-icon name="input" /></span><h1 class="text-base font-semibold">算法可视化学习平台</h1></div>

    <h2 class="text-4xl font-semibold leading-tight tracking-tight sm:text-5xl">看懂算法的<br>每一步</h2>


  </section>
  <section class="auth-form" aria-labelledby="auth-title">
    <h2 id="auth-title" class="text-2xl font-semibold">{{ mode === 'login' ? '欢迎回来' : '创建账号' }}</h2>

    <div class="my-6 flex rounded-md bg-subtle p-1" role="group" aria-label="账户操作">
      <button class="flex-1 rounded px-3 py-2 text-sm" [class.bg-surface]="mode === 'login'" [class.text-accent]="mode === 'login'" [attr.aria-pressed]="mode === 'login'" (click)="switchMode('login')">登录</button>
      <button class="flex-1 rounded px-3 py-2 text-sm" [class.bg-surface]="mode === 'register'" [class.text-accent]="mode === 'register'" [attr.aria-pressed]="mode === 'register'" (click)="switchMode('register')">注册</button>
    </div>
        <form *ngIf="mode === 'login'" (ngSubmit)="submitLogin()" class="space-y-4">
          <div *ngIf="auth.success()" role="status" class="text-sm text-success bg-success-soft border border-success rounded px-3 py-2">
            {{ auth.success() }}
          </div>

          <div>
            <label for="loginUsername" class="block text-sm text-muted mb-2">用户名</label>
            <input
              id="loginUsername" name="loginUsername"
              type="text"
              autocomplete="username"
              [(ngModel)]="loginUsername"
              class="w-full bg-subtle border border-line rounded px-3 py-3 text-ink focus:outline-none focus:border-active"
              placeholder="请输入用户名">
          </div>

          <div>
            <label for="loginPassword" class="block text-sm text-muted mb-2">密码</label>
            <input
              id="loginPassword" name="loginPassword"
              type="password"
              autocomplete="current-password"
              [(ngModel)]="loginPassword"
              class="w-full bg-subtle border border-line rounded px-3 py-3 text-ink focus:outline-none focus:border-active"
              placeholder="请输入密码">
          </div>

          <div *ngIf="auth.error()" role="alert" class="text-sm text-danger bg-danger-soft border border-danger rounded px-3 py-2">
            {{ auth.error() }}
          </div>

          <button
            type="submit"
            [disabled]="auth.isLoading()"
            class="button-primary w-full">
            {{ auth.isLoading() ? '正在登录...' : '登录' }}
          </button>
        </form>

        <form *ngIf="mode === 'register'" (ngSubmit)="submitRegister()" class="space-y-4">
          <div>
            <label for="registerUsername" class="block text-sm text-muted mb-2">用户名</label>
            <input
              id="registerUsername" name="registerUsername"
              type="text"
              autocomplete="username"
              [(ngModel)]="registerUsername"
              class="w-full bg-subtle border border-line rounded px-3 py-3 text-ink focus:outline-none focus:border-active"
              placeholder="至少 3 个字符">
          </div>

          <div>
            <label for="registerDisplayName" class="block text-sm text-muted mb-2">显示名称</label>
            <input
              id="registerDisplayName" name="registerDisplayName"
              type="text"
              [(ngModel)]="registerDisplayName"
              class="w-full bg-subtle border border-line rounded px-3 py-3 text-ink focus:outline-none focus:border-active"
              placeholder="用于页面右上角显示">
          </div>

          <div>
            <label for="registerPassword" class="block text-sm text-muted mb-2">密码</label>
            <input
              id="registerPassword" name="registerPassword"
              type="password"
              autocomplete="new-password"
              [(ngModel)]="registerPassword"
              class="w-full bg-subtle border border-line rounded px-3 py-3 text-ink focus:outline-none focus:border-active"
              placeholder="至少 6 个字符">
          </div>

          <div>
            <label for="registerConfirmPassword" class="block text-sm text-muted mb-2">确认密码</label>
            <input
              id="registerConfirmPassword" name="registerConfirmPassword"
              type="password"
              autocomplete="new-password"
              [(ngModel)]="registerConfirmPassword"
              class="w-full bg-subtle border border-line rounded px-3 py-3 text-ink focus:outline-none focus:border-active"
              placeholder="再次输入密码">
          </div>

          <div *ngIf="auth.error()" role="alert" class="text-sm text-danger bg-danger-soft border border-danger rounded px-3 py-2">
            {{ auth.error() }}
          </div>

          <button
            type="submit"
            [disabled]="auth.isLoading()"
            class="button-primary w-full">
            {{ auth.isLoading() ? '正在创建...' : '创建账号' }}
          </button>
        </form>
  </section>
</main>
