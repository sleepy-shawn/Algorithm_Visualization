<div class="auth-preferences"><app-display-preferences /></div>
<main class="auth-layout">
  <section class="auth-intro">
    <div class="mb-8 flex items-center gap-3"><span class="college-emblem college-emblem-large"><img src="assets/branding/college-logo.png" width="514" height="84" [attr.alt]="'计算机与人工智能学院院徽' | t"></span><h1 class="text-base font-semibold">{{ '算法可视化学习平台' | t }}</h1></div>

    <h2 class="display-title">{{ '看懂算法的' | t }}<br><span class="title-underline">{{ '每一步' | t }}<svg viewBox="0 0 240 14" aria-hidden="true"><path d="M3 9 Q 94 0 237 7 M19 13 Q 135 5 217 11" /></svg></span></h2>
    <div class="auth-equation" role="img" [attr.aria-label]="'一次相邻交换：3、1、2 变成 1、3、2' | t">
      <span>3</span><span>1</span><span>2</span><span class="equation-arrow" aria-hidden="true"><app-ui-icon name="arrow-right" /></span><span>1</span><span>3</span><span>2</span>
    </div>


  </section>
  <section class="auth-form" aria-labelledby="auth-title">
    <h2 id="auth-title" class="section-title">{{ (mode === 'login' ? '欢迎回来' : '创建账号') | t }}</h2>

    <div class="my-6 flex rounded-md bg-subtle p-1" role="group" [attr.aria-label]="'账户操作' | t">
      <button class="flex-1 rounded px-3 py-2 text-sm" [class.bg-surface]="mode === 'login'" [class.text-accent-ink]="mode === 'login'" [attr.aria-pressed]="mode === 'login'" (click)="switchMode('login')">{{ '登录' | t }}</button>
      <button class="flex-1 rounded px-3 py-2 text-sm" [class.bg-surface]="mode === 'register'" [class.text-accent-ink]="mode === 'register'" [attr.aria-pressed]="mode === 'register'" (click)="switchMode('register')">{{ '注册' | t }}</button>
    </div>
        <form *ngIf="mode === 'login'" (ngSubmit)="submitLogin()" class="space-y-4">
          <div *ngIf="auth.success()" role="status" class="text-sm text-success bg-success-soft border border-success rounded px-3 py-2">
            {{ (auth.success()) | t }}
          </div>

          <div>
            <label for="loginUsername" class="block text-sm text-muted mb-2">{{ '用户名' | t }}</label>
            <input
              id="loginUsername" name="loginUsername"
              type="text"
              autocomplete="username"
              [(ngModel)]="loginUsername"
              class="w-full bg-subtle border border-line rounded px-3 py-3 text-ink focus:outline-none focus:border-active"
              [attr.placeholder]="'请输入用户名' | t">
          </div>

          <div>
            <label for="loginPassword" class="block text-sm text-muted mb-2">{{ '密码' | t }}</label>
            <input
              id="loginPassword" name="loginPassword"
              type="password"
              autocomplete="current-password"
              [(ngModel)]="loginPassword"
              class="w-full bg-subtle border border-line rounded px-3 py-3 text-ink focus:outline-none focus:border-active"
              [attr.placeholder]="'请输入密码' | t">
          </div>

          <div *ngIf="auth.error()" role="alert" class="text-sm text-danger bg-danger-soft border border-danger rounded px-3 py-2">
            {{ (auth.error()) | t }}
          </div>

          <button
            type="submit"
            [disabled]="auth.isLoading()"
            class="button-primary w-full">
            {{ (auth.isLoading() ? '正在登录...' : '登录') | t }}
          </button>
        </form>

        <form *ngIf="mode === 'register'" (ngSubmit)="submitRegister()" class="space-y-4">
          <div>
            <label for="registerUsername" class="block text-sm text-muted mb-2">{{ '用户名' | t }}</label>
            <input
              id="registerUsername" name="registerUsername"
              type="text"
              autocomplete="username"
              [(ngModel)]="registerUsername"
              class="w-full bg-subtle border border-line rounded px-3 py-3 text-ink focus:outline-none focus:border-active"
              [attr.placeholder]="'至少 3 个字符' | t">
          </div>

          <div>
            <label for="registerDisplayName" class="block text-sm text-muted mb-2">{{ '显示名称' | t }}</label>
            <input
              id="registerDisplayName" name="registerDisplayName"
              type="text"
              [(ngModel)]="registerDisplayName"
              class="w-full bg-subtle border border-line rounded px-3 py-3 text-ink focus:outline-none focus:border-active"
              [attr.placeholder]="'用于页面右上角显示' | t">
          </div>

          <div>
            <label for="registerPassword" class="block text-sm text-muted mb-2">{{ '密码' | t }}</label>
            <input
              id="registerPassword" name="registerPassword"
              type="password"
              autocomplete="new-password"
              [(ngModel)]="registerPassword"
              class="w-full bg-subtle border border-line rounded px-3 py-3 text-ink focus:outline-none focus:border-active"
              [attr.placeholder]="'至少 6 个字符' | t">
          </div>

          <div>
            <label for="registerConfirmPassword" class="block text-sm text-muted mb-2">{{ '确认密码' | t }}</label>
            <input
              id="registerConfirmPassword" name="registerConfirmPassword"
              type="password"
              autocomplete="new-password"
              [(ngModel)]="registerConfirmPassword"
              class="w-full bg-subtle border border-line rounded px-3 py-3 text-ink focus:outline-none focus:border-active"
              [attr.placeholder]="'再次输入密码' | t">
          </div>

          <div *ngIf="auth.error()" role="alert" class="text-sm text-danger bg-danger-soft border border-danger rounded px-3 py-2">
            {{ (auth.error()) | t }}
          </div>

          <button
            type="submit"
            [disabled]="auth.isLoading()"
            class="button-primary w-full">
            {{ (auth.isLoading() ? '正在创建...' : '创建账号') | t }}
          </button>
        </form>
  </section>
</main>
