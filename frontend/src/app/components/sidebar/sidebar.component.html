<aside class="w-full lg:w-56 h-full bg-surface border-r border-line flex flex-col overflow-hidden">
  <div class="px-3 py-3 text-xs font-semibold text-muted uppercase tracking-wider border-b border-line flex-shrink-0">
    {{ '学习内容' | t }}
  </div>

  <div class="flex-1 overflow-y-auto py-2 min-h-0">
    <div *ngFor="let group of groups" class="mb-1">
      <div class="px-3 py-2 text-xs font-semibold text-muted flex items-center gap-2">
        <app-ui-icon [name]="group.icon" />
        <span>{{ (group.category === 'Web3D' ? '3D 数据结构' : group.category) | t }}</span>
      </div>

      <button
        *ngFor="let item of group.items"
        (click)="select(item.id)"
        [attr.aria-current]="store.selectedAlgo() === item.id ? 'true' : null"
        [class]="store.selectedAlgo() === item.id
          ? 'block w-full pl-4 pr-2 py-2 text-left text-sm bg-active-soft text-active border-l-2 border-active'
          : 'block w-full pl-4 pr-2 py-2 text-left text-sm text-muted hover:text-ink hover:bg-subtle border-l-2 border-transparent'">
        <div class="font-medium leading-none truncate">{{ (item.label) | t }}</div>

      </button>
    </div>
  </div>

  <div class="border-t border-line px-3 py-2 flex-shrink-0">
    <button
      (click)="store.toggleCompareMode()"
      [class]="store.compareMode()
        ? 'w-full px-3 py-2 rounded text-xs font-medium bg-swap-soft text-swap border border-swap flex items-center gap-2 justify-center'
        : 'w-full px-3 py-2 rounded text-xs font-medium text-muted hover:text-ink hover:bg-subtle border border-line flex items-center gap-2 justify-center'">
      <span>{{ '对比模式' | t }}</span>
      <span *ngIf="store.compareMode()" class="text-swap">{{ '已开启' | t }}</span>
    </button>

    <div *ngIf="store.compareMode()" class="mt-2" role="group" [attr.aria-label]="'对比算法' | t">
      <div class="text-xs text-muted uppercase tracking-wider mb-2 px-1">{{ '对比算法' | t }}</div>
      <button
        *ngFor="let item of compareSiblings()"
        (click)="selectCompare(item.id)"
        [class]="store.compareAlgo() === item.id
          ? 'w-full text-left px-3 py-2 text-xs rounded bg-swap-soft text-swap border-l-2 border-swap'
          : 'w-full text-left px-3 py-2 text-xs rounded text-muted hover:text-ink hover:bg-subtle border-l-2 border-transparent'">
        {{ (item.label) | t }}
      </button>
      <div *ngIf="compareSiblings().length === 0" class="text-xs text-muted px-1">
        {{ '当前分类暂无可对比算法' | t }}
      </div>
    </div>
  </div>
</aside>
