<div class="algorithm-navigation" role="group" [attr.aria-label]="'算法分类' | t">
  <div class="algorithm-navigation-row">
    <div *ngFor="let group of groups; let index = index" class="algorithm-navigation-item">
      <button class="category-trigger" [class.is-active]="activeGroup() === group.category"
        [attr.aria-expanded]="openGroup === group.category" [attr.aria-controls]="'algorithm-group-' + index"
        (click)="toggle(group.category, $event)">
        {{ shortNames[group.category] | t }}
        <app-ui-icon name="chevron-down" [class.rotate-180]="openGroup === group.category" />
      </button>
      <div *ngIf="openGroup === group.category" class="algorithm-dropdown" [id]="'algorithm-group-' + index"
        role="group" [attr.aria-label]="shortNames[group.category] | t">
        <button *ngFor="let item of group.items" class="algorithm-option" (click)="select(item.id)"
          [attr.aria-current]="store.selectedAlgo() === item.id ? 'true' : null">
          {{ item.label | t }}<app-ui-icon name="arrow-right" />
        </button>
      </div>
    </div>
    <div class="algorithm-navigation-item compare-navigation">
      <button class="category-trigger" [class.is-active]="store.compareMode()"
        [attr.aria-expanded]="openGroup === 'compare'" aria-controls="compare-options" (click)="toggle('compare', $event)">
        {{ '对比' | t }}<app-ui-icon name="chevron-down" [class.rotate-180]="openGroup === 'compare'" />
      </button>
      <div *ngIf="openGroup === 'compare'" class="algorithm-dropdown" id="compare-options" role="group" [attr.aria-label]="'对比算法' | t">
        <button class="algorithm-option compare-toggle" [attr.aria-pressed]="store.compareMode()" (click)="store.toggleCompareMode()">
          {{ '对比模式' | t }}<span class="toggle-track" [class.is-on]="store.compareMode()" aria-hidden="true"><span></span></span>
        </button>
        <ng-container *ngIf="store.compareMode()">
          <button *ngFor="let item of compareSiblings()" class="algorithm-option" (click)="selectCompare(item.id)"
            [attr.aria-pressed]="store.compareAlgo() === item.id">{{ item.label | t }}</button>
          <p *ngIf="compareSiblings().length === 0" class="px-4 py-3 text-sm text-muted">{{ '当前分类暂无可对比算法' | t }}</p>
        </ng-container>
      </div>
    </div>
  </div>
</div>
