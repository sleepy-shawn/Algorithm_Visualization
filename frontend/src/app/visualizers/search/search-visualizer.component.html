<div class="flex-1 flex flex-col items-center justify-center p-6 gap-6">
  <ng-container *ngIf="step() as s">

    <!-- Target -->
    <div class="flex items-center gap-3 text-sm">
      <span class="text-slate-400">目标值:</span>
      <span class="px-3 py-1 rounded-lg bg-yellow-600/30 text-yellow-400 font-bold font-mono text-lg">{{ s.target }}</span>
      <span *ngIf="s.found === true"  class="text-green-400 font-medium">✓ 已找到！</span>
      <span *ngIf="s.found === false" class="text-red-400 font-medium">✗ 未找到</span>
    </div>

    <!-- Array cells -->
    <div class="flex gap-2 flex-wrap justify-center">
      <div
        *ngFor="let val of s.array; let i = index; trackBy: trackByIndex"
        class="relative flex flex-col items-center gap-1">
        <!-- Pointer labels -->
        <div class="text-xs h-4 text-center">
          <span *ngIf="i === s.mid" class="text-purple-400 font-mono">mid</span>
        </div>

        <div class="w-12 h-12 flex items-center justify-center rounded-lg font-mono font-bold text-white transition-all duration-200"
          [ngClass]="cellColor(i)">
          {{ val }}
        </div>

        <div class="text-xs h-4 text-slate-600 font-mono text-center">{{ i }}</div>
        <div class="text-xs h-3 text-center">
          <span *ngIf="i === s.left"  class="text-yellow-500 font-mono">L</span>
          <span *ngIf="i === s.right" class="text-yellow-500 font-mono">R</span>
        </div>
      </div>
    </div>

    <div class="w-full max-w-3xl grid gap-3 lg:grid-cols-2">
      <!-- Description -->
      <div class="p-3 bg-slate-800/60 rounded-lg border border-slate-700">
        <div class="flex items-center justify-between gap-3 mb-1">
          <span class="text-xs font-semibold text-blue-300">当前步骤</span>
          <span class="text-xs font-mono text-slate-500">第 {{ s.codeLine }} 行</span>
        </div>
        <p class="text-sm text-slate-200">{{ s.description }}</p>
        <div class="flex gap-4 mt-2 text-xs text-slate-500">
          <span>比较次数: <strong class="text-yellow-400">{{ s.comparisons }}</strong></span>
          <span>当前范围: <strong class="text-blue-400">[{{ s.left }}, {{ s.right }}]</strong></span>
        </div>
      </div>
      <app-code-panel title="二分查找伪代码" [lines]="pseudoCode" [currentLine]="s.codeLine" />
    </div>

    <!-- Legend -->
    <div class="flex gap-4 text-xs text-slate-500">
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-purple-600 inline-block"></span>mid</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-blue-700/60 inline-block"></span>当前范围</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-yellow-600/60 inline-block"></span>L/R 边界</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-green-600 inline-block"></span>找到</span>
    </div>
  </ng-container>
</div>
