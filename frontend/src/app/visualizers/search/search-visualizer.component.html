<div class="flex-1 flex flex-col items-center justify-center p-6 gap-6">
  <ng-container *ngIf="step() as s">

    <!-- Target -->
    <div class="flex items-center gap-3 text-sm">
      <span class="text-muted">{{ '目标值:' | t }}</span>
      <span class="px-3 py-1 rounded-lg bg-compare-soft text-compare font-bold font-mono text-lg">{{ s.target }}</span>
      <span *ngIf="s.found === true"  class="inline-flex items-center gap-1 text-success font-medium"><app-ui-icon name="check" />{{ '已找到' | t }}</span>
      <span *ngIf="s.found === false" class="inline-flex items-center gap-1 text-danger font-medium"><app-ui-icon name="close" />{{ '未找到' | t }}</span>
    </div>

    <!-- Array cells -->
    <div class="flex gap-2 flex-wrap justify-center">
      <div
        *ngFor="let val of s.array; let i = index; trackBy: trackByIndex"
        class="relative flex flex-col items-center gap-1">
        <!-- Pointer labels -->
        <div class="text-xs h-4 text-center">
          <span *ngIf="i === s.mid" class="text-swap font-mono">mid</span>
        </div>

        <div class="w-12 h-12 flex items-center justify-center rounded-lg font-mono font-bold text-ink viz-transition"
          [ngClass]="cellColor(i)">
          {{ val }}
        </div>

        <div class="text-xs h-4 text-muted font-mono text-center">{{ i }}</div>
        <div class="text-xs h-3 text-center">
          <span *ngIf="i === s.left"  class="text-compare font-mono">L</span>
          <span *ngIf="i === s.right" class="text-compare font-mono">R</span>
        </div>
      </div>
    </div>

    <!-- Description -->
    <div class="w-full max-w-xl p-3 bg-subtle rounded-lg border border-line">
      <p class="text-sm text-ink text-center">{{ (s.description) | t }}</p>
      <div class="flex flex-wrap gap-4 mt-2 text-xs text-muted justify-center">

        <span>{{ '当前范围:' | t }} <strong class="text-active">[{{ s.left }}, {{ s.right }}]</strong></span>
      </div>
    </div>

    <!-- Legend -->
    <div class="flex flex-wrap gap-4 text-xs text-muted">
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-viz-swap inline-block"></span>mid</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-viz-neutral inline-block"></span>{{ '当前范围' | t }}</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-viz-compare inline-block"></span>{{ 'L/R 边界' | t }}</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-viz-success inline-block"></span>{{ '找到' | t }}</span>
    </div>
  </ng-container>
</div>
