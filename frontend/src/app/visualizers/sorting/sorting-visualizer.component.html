<div class="flex-1 flex flex-col p-4 overflow-hidden">
  <ng-container *ngIf="step() as s">

    <!-- Bars -->
    <div class="flex-1 flex items-end justify-center gap-1 pb-2 min-h-0">
      <div
        *ngFor="let val of s.array; let i = index; trackBy: trackByIndex"
        class="flex flex-col items-center gap-1 flex-1 max-w-[60px]"
        style="transition: all 0.15s ease">
        <span class="text-xs text-slate-400 font-mono">{{ val }}</span>
        <div
          class="w-full rounded-t transition-all duration-150"
          [style.height.px]="barHeight(val)"
          [style.background]="barColor(i)">
        </div>
        <span class="text-xs text-slate-600 font-mono">{{ i }}</span>
      </div>
    </div>

    <div class="flex flex-col xl:flex-row gap-3 flex-shrink-0 mt-2">
      <!-- Step explanation -->
      <div class="flex-1 p-3 bg-slate-800/60 rounded-lg border border-slate-700">
        <div class="flex items-center justify-between gap-3 mb-1">
          <span class="text-xs font-semibold text-blue-300">当前步骤</span>
          <span class="text-xs font-mono text-slate-500">第 {{ s.codeLine }} 行</span>
        </div>
        <p class="text-sm text-slate-200">{{ s.description }}</p>
        <div class="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-xs text-slate-500">
          <span>比较: <strong class="text-yellow-400">{{ s.comparisons }}</strong></span>
          <span>交换: <strong class="text-red-400">{{ s.swaps }}</strong></span>
          <span>访问: <strong class="text-blue-400">{{ s.accesses }}</strong></span>
        </div>
      </div>

      <!-- Quick-sort code panel. Other sorting algorithms keep their existing visualizer until their code map is added. -->
      <section *ngIf="isQuickSort()" class="xl:w-[31rem] p-3 bg-slate-900 rounded-lg border border-slate-700 overflow-x-auto">
        <div class="text-xs font-semibold text-slate-300 mb-2">快速排序伪代码</div>
        <div
          *ngFor="let line of quickSortPseudoCode; let i = index; trackBy: trackByIndex"
          class="grid grid-cols-[2rem_1fr] gap-2 rounded px-2 py-1 font-mono text-xs leading-5 transition-colors duration-150"
          [class.bg-blue-600]="s.codeLine === i + 1"
          [class.text-white]="s.codeLine === i + 1"
          [class.text-slate-400]="s.codeLine !== i + 1">
          <span class="select-none text-right" [class.text-blue-200]="s.codeLine === i + 1" [class.text-slate-600]="s.codeLine !== i + 1">{{ i + 1 }}</span>
          <code class="whitespace-pre">{{ line }}</code>
        </div>
      </section>
    </div>

    <!-- Legend -->
    <div class="flex gap-4 mt-2 text-xs text-slate-500 justify-center">
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-blue-500 inline-block"></span>未排序</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-yellow-500 inline-block"></span>比较中</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-red-500 inline-block"></span>交换中</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-purple-500 inline-block"></span>基准值</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-emerald-500 inline-block"></span>已排序</span>
    </div>
  </ng-container>
</div>
