<div class="flex-1 flex flex-col p-4 overflow-hidden">
  <ng-container *ngIf="step() as s">

    <!-- Bars -->
    <div class="flex-1 flex items-end justify-center gap-1 pb-2 min-h-0">
      <div
        *ngFor="let val of s.array; let i = index; trackBy: trackByIndex"
        class="flex flex-col items-center gap-1 flex-1 max-w-[60px]"
        >
        <span class="text-xs text-muted font-mono">{{ val }}</span>
        <div
          class="w-full rounded-t viz-transition"
          [style.height.px]="barHeight(val)"
          [style.background]="barColor(i)">
        </div>
        <span class="text-xs text-muted font-mono">{{ i }}</span>
      </div>
    </div>

    <!-- Description -->
    <div class="flex-shrink-0 mt-2 p-3 bg-subtle rounded-lg border border-line">
      <p class="text-sm text-ink">{{ s.description }}</p>

    </div>

    <!-- Legend -->
    <div class="flex flex-wrap gap-4 mt-2 text-xs text-muted justify-center">
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-viz-neutral inline-block"></span>未排序</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-viz-compare inline-block"></span>比较中</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-viz-swap inline-block"></span>交换中</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-viz-pivot inline-block"></span>基准值</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-viz-success inline-block"></span>已排序</span>
    </div>
  </ng-container>
</div>
