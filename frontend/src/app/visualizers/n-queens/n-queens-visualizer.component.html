<div class="flex-1 flex flex-col p-4 overflow-hidden">
  <ng-container *ngIf="step() as s">

    <div class="flex gap-6 flex-1 min-h-0">

      <!-- Board -->
      <div class="flex items-center justify-center flex-1">
        <div class="inline-block border-2 border-slate-600 rounded overflow-hidden">
          <div *ngFor="let r of rows(); trackBy: trackByNum" class="flex">
            <div
              *ngFor="let c of cols(); trackBy: trackByNum"
              class="w-12 h-12 flex items-center justify-center text-2xl transition-colors duration-200 relative"
              [ngClass]="cellClass(r, c)">
              <span *ngIf="hasQueen(r, c)">♛</span>
              <span *ngIf="isConflict(r, c) && !hasQueen(r, c)" class="text-red-400 text-sm">✗</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Stats -->
      <div class="w-44 flex flex-col gap-2 text-xs">
        <div class="bg-slate-800 rounded-lg p-3 border border-slate-700">
          <div class="text-slate-500 mb-1">当前行</div>
          <div class="text-white font-bold text-lg">{{ s.currentRow }}</div>
        </div>
        <div class="bg-slate-800 rounded-lg p-3 border border-slate-700">
          <div class="text-slate-500 mb-1">找到解数</div>
          <div class="text-green-400 font-bold text-lg">{{ s.solutionsFound }}</div>
        </div>
        <div class="bg-slate-800 rounded-lg p-3 border border-slate-700">
          <div class="text-slate-500 mb-1">回溯次数</div>
          <div class="text-red-400 font-bold text-lg">{{ s.backtracks }}</div>
        </div>

        <!-- Recent solutions -->
        <div *ngIf="s.solutions.length > 0" class="bg-slate-800 rounded-lg p-2 border border-slate-700 overflow-y-auto flex-1">
          <div class="text-slate-500 mb-1">已找到的解</div>
          <div *ngFor="let sol of s.solutions; let si = index; trackBy: trackByNum"
            class="text-slate-400 font-mono text-xs mb-0.5">
            #{{ si + 1 }}: [{{ sol.join(',') }}]
          </div>
        </div>
      </div>
    </div>

    <div class="grid gap-3 lg:grid-cols-2 flex-shrink-0 mt-2">
      <!-- Description -->
      <div class="p-3 bg-slate-800/60 rounded-lg border border-slate-700">
        <div class="flex items-center justify-between gap-3 mb-1">
          <span class="text-xs font-semibold text-blue-300">当前步骤</span>
          <span class="text-xs font-mono text-slate-500">第 {{ s.codeLine }} 行</span>
        </div>
        <p class="text-sm text-slate-200">{{ s.description }}</p>
      </div>
      <app-code-panel title="N 皇后回溯伪代码" [lines]="pseudoCode" [currentLine]="s.codeLine" />
    </div>
  </ng-container>
</div>
