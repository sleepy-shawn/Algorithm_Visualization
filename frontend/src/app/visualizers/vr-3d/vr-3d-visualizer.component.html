<div class="w-full min-h-0 flex flex-col bg-page text-ink overflow-hidden">

    <div class="flex flex-wrap items-center gap-2 px-4 py-3 border-b border-line bg-surface">


        <span class="text-xs text-active">
            {{ (currentInfo.title) | t }}
        </span>

        <span class="text-xs text-muted">
            {{ (operationStatus) | t }}
        </span>

        <span class="ml-auto text-xs text-muted">
          {{ '鼠标拖拽旋转，滚轮缩放，右键平移' | t }}
        </span>
    </div>

    <div class="flex-1 min-h-0 grid grid-cols-1 xl:grid-cols-3 overflow-hidden">

        <div class="xl:col-span-2 min-h-0 flex items-start justify-center p-6 bg-page">
            <div class="relative w-full max-w-5xl h-[420px] sm:h-[60vh] max-h-[720px] min-h-[420px] rounded-lg overflow-hidden border border-line bg-page">
                <div #canvasContainer class="absolute inset-0"></div>
            </div>
        </div>

        <aside class="border-l border-line bg-surface overflow-auto">


            <section class="p-4 border-b border-line">
                <div class="flex">
                    <button
                            (click)="resetView()"
                            class="random-input-button text-xs">
                        <app-ui-icon name="reset" /> {{ '重置视角' | t }}
                    </button>
                </div>
            </section>

            <section class="p-4">
              <h3 class="mb-3 text-sm font-medium">{{ '操作' | t }}</h3>
              <div class="grid grid-cols-2 gap-2">
                <button *ngFor="let op of currentInfo.operations" (click)="performOperation(op.name)" class="button-secondary text-xs"><app-ui-icon name="play" />{{ op.name | t }}</button>
              </div>
            </section>
        </aside>
    </div>
</div>
